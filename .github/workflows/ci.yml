name: Validate skill and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Verified against the official release and its linked commit, 2026-11-03.
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://github.com/actions/setup-python/releases/tag/v7.1.0
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate repository structure
        run: python scripts/check.py
      - name: Test claim checker integrity rules
        run: python scripts/test_check_claims.py
      - name: Test repair release gate
        run: python scripts/test_check_repairs.py
      - name: Validate frozen claims and review evidence
        run: >-
          python scripts/check_claims.py
          --output-index evaluations/runs/2026-11-03-v0.4.0/output-index.json
          --reviews
          evaluations/runs/2026-11-03-v0.4.0/reviews/core.json
          evaluations/runs/2026-11-03-v0.4.0/reviews/long.json
          evaluations/runs/2026-11-03-v0.4.0/reviews/onboarding.json
          evaluations/runs/2026-11-03-v0.4.0/reviews/transfer.json
      - name: Validate completed repairs and published examples
        run: python scripts/check_repairs.py
      - name: Validate source-only writing review evidence
        run: >-
          python scripts/check_claims.py
          --output-index evaluations/runs/2026-11-03-v0.5.0/forward/output-index.json
          --reviews evaluations/runs/2026-11-03-v0.5.0/forward/reviews/first.json
      - name: Validate new-topic blind review evidence
        run: >-
          python scripts/check_claims.py
          --contract evaluations/runs/2026-11-05-v0.6.0/new-topic-contract.json
          --output-index evaluations/runs/2026-11-05-v0.6.0/forward/blind-index.json
          --reviews evaluations/runs/2026-11-05-v0.6.0/forward/reviews/blind.json
      - name: Require complete final new-topic examples
        run: >-
          python scripts/check_claims.py
          --contract evaluations/runs/2026-11-05-v0.6.0/new-topic-contract.json
          --output-index evaluations/runs/2026-11-05-v0.6.0/forward/final-index.json
          --reviews evaluations/runs/2026-11-05-v0.6.0/forward/reviews/final.json
          --require-complete
      - name: Validate report regression blind reviews
        run: >-
          python scripts/check_claims.py
          --contract evaluations/runs/2026-11-06-v0.7.0/new-topic-contract.json
          --output-index evaluations/runs/2026-11-06-v0.7.0/forward/blind-index.json
          --reviews evaluations/runs/2026-11-06-v0.7.0/forward/reviews/blind.json
      # https://github.com/actions/setup-node/releases/tag/v7.1.0
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify generated Markdown is current
        run: python scripts/build_docs.py --check
      - name: Verify generated HTML is current
        run: node scripts/build_viewer.mjs --check
      - name: Validate comparison navigation and exact downloads
        run: node scripts/check_viewer.mjs
      - name: Verify skills CLI installation in temporary projects
        run: python scripts/check_install.py
      - name: Verify installation from the published commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/check_install.py --source "https://github.com/${{ github.repository }}/tree/${{ github.sha }}"
      - name: Build reproducible release package
        run: |
          python scripts/package.py --output-dir dist/first
          python scripts/package.py --output-dir dist/second
          cmp dist/first/korean-dev-writing-v0.7.0.zip dist/second/korean-dev-writing-v0.7.0.zip

  browser:
    name: Check comparison reader in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/viewer-test" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      # The Azure mirror stalled .deb downloads in run 42156838692.
      # Preserve the runner's other Ubuntu mirrors and package signature checks.
      - name: Avoid stalled Ubuntu package mirror
        run: |
          test -f /etc/apt/apt-mirrors.txt
          sudo sed -i '/azure[.]archive[.]ubuntu[.]com/d' /etc/apt/apt-mirrors.txt
          test -s /etc/apt/apt-mirrors.txt
      - name: Install Chromium and Korean fonts
        run: |
          node "$RUNNER_TEMP/viewer-test/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Check section links, reading mode, and mobile layout
        run: PLAYWRIGHT_MODULE_PATH="$RUNNER_TEMP/viewer-test/node_modules/playwright/index.mjs" node scripts/check_viewer_browser.mjs
